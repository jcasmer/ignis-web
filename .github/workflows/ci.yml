name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
